<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="admin-page-header">
                <h2 class="admin-page-title"><i class="bi bi-person-plus" aria-hidden="true"></i> Ajouter un résident</h2>
                <button type="button" class="btn-back" (click)="retour()"><i class="bi bi-arrow-left" aria-hidden="true"></i> Retour</button>
            </div>


            <div class="card dashboard-card">
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Remplissez les informations ci-dessous pour créer un nouveau résident.
                        Vous serez ensuite redirigé vers son dossier pour y ajouter des stages.</p>

                    <form (ngSubmit)="creerResident()">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">CIN / N° Passeport <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control elegant-input" [(ngModel)]="nouveauResident.cin"
                                    name="cin" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label text-muted small fw-bold">Nom et Prénom <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control elegant-input"
                                    [(ngModel)]="nouveauResident.nom_prenom" name="nom" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold">E-mail de connexion</label>
                                <input type="email" class="form-control elegant-input" [(ngModel)]="nouveauResident.email"
                                    name="email" autocomplete="off">
                                <div class="form-text">Le résident recevra ses codes de connexion à cette adresse.
                                    Sans e-mail, il ne pourra pas se connecter.</div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold">Spécialité</label>
                                <select class="form-select elegant-input" [(ngModel)]="nouveauResident.specialite"
                                    name="spec">
                                    @for (spec of specialites; track spec) {
                                    <option [value]="spec">{{ spec }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Faculté d'origine</label>
                                <select class="form-select elegant-input" [(ngModel)]="nouveauResident.faculte_origine"
                                    name="fac">
                                    @for (fac of facultes; track fac) {
                                    <option [value]="fac">{{ fac }}</option>
                                    }
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Niveau d'étude</label>
                                <select class="form-select elegant-input" [(ngModel)]="nouveauResident.niveau"
                                    name="niv">
                                    <option [ngValue]="1">1ère Année</option>
                                    <option [ngValue]="2">2ème Année</option>
                                    <option [ngValue]="3">3ème Année</option>
                                    <option [ngValue]="4">4ème Année</option>
                                    <option [ngValue]="5">5ème Année</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn pill-btn-orange px-4"
                                [disabled]="isSaving || !nouveauResident.cin || !nouveauResident.nom_prenom">
                                @if (isSaving) {
                                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span> Création…
                                } @else {
                                Créer et passer aux stages <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
                                }
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
