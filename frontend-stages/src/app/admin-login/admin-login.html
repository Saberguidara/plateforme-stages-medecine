<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-danger">
        <div class="card-header bg-danger text-white text-center">
          <h4>🔒 Accès Sécurisé - Scolarité</h4>
        </div>
        <div class="card-body p-4">
          <form (ngSubmit)="seConnecter()">
            <div *ngIf="messageErreur" class="alert alert-warning">{{ messageErreur }}</div>

            <div class="mb-3">
              <label class="form-label">Identifiant</label>
              <input name="login" type="text" class="form-control" [(ngModel)]="loginSaisi">
            </div>

            <div class="mb-4">
              <label class="form-label">Mot de passe</label>
              <input name="password" type="password" class="form-control" [(ngModel)]="motDePasseSaisi">
            </div>

            <button type="submit" class="btn btn-danger w-100">Se connecter</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
