<div class="app-container">
    <header class="app-header" *ngIf="!isLoginPage()">
        <div class="header-layout">
            <div class="header-empty-space" aria-hidden="true"></div>

            <div class="header-center-block">
                <img src="logo.png" alt="Logo de la faculté" class="header-logo">
                <div class="header-text ms-3 text-center text-md-start">
                    <h1 class="header-main-title">PLATEFORME DES STAGES</h1>
                    <h2 class="header-sub-title mb-0">Service des stages - Faculté de médecine de Sfax</h2>
                </div>
            </div>

            <div class="header-user-actions" *ngIf="estConnecte(); else lienConnexion">
                <span class="header-welcome-text"><strong>Bienvenue</strong> {{ getUserName() }}</span>
                <button type="button" class="btn-header-logout" (click)="logout()">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Déconnexion
                </button>
            </div>
            <ng-template #lienConnexion>
                <div class="header-user-actions">
                    <a class="btn-header-logout" routerLink="/login"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Connexion</a>
                </div>
            </ng-template>
        </div>
    </header>
    <main class="main-content">
        <router-outlet></router-outlet>
    </main>
    <footer class="app-footer" *ngIf="!isLoginPage()">
        &copy; {{ annee }} Saber GUIDARA - Faculté de Médecine de Sfax
    </footer>
</div>

<app-toasts></app-toasts>
<app-pdf-viewer></app-pdf-viewer>
