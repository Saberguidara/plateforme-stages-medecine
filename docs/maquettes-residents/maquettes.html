<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Maquettes tableau résidents</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{--beige:#f5f0e6;--noir:#1a1a1a;--orange:#f47b45;--orange-f:#b5521f;--orange-p:#fef6f0;--blanc:#fff;--gris:#666;--gris-c:#e9e4da;--ligne:#efeae0;--succes:#1f7a4d;--erreur:#b42318;--titre:Georgia,serif}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#d9d3c7;color:var(--noir);font-size:13px}
.maquette{width:1440px;height:900px;display:flex;flex-direction:column;background:var(--beige);overflow:hidden;margin:0 0 40px}
.etiquette{font:600 13px Arial;padding:8px 14px;background:var(--noir);color:var(--beige)}
/* en-tête du site */
.site-entete{height:56px;background:var(--blanc);border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;padding:0 24px;gap:12px;flex:0 0 auto}
.logo{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font:700 13px var(--titre)}
.site-nom{font:16px var(--titre)}
.site-entete .droite{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--gris)}
.corps{flex:1;display:flex;min-height:0}
.nav{flex:0 0 220px;background:var(--blanc);border-right:1px solid rgba(0,0,0,.06);padding:20px 12px;display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;gap:11px;align-items:center;padding:9px 13px;border-radius:50px;color:var(--noir);text-decoration:none;font-size:13.5px}
.nav a i{color:var(--orange)}
.nav a.actif{background:var(--noir);color:var(--beige)}
.nav .groupe{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--gris);padding:14px 13px 4px}
.contenu{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 26px 0}
h1{font:400 24px var(--titre);margin:0;display:flex;align-items:center;gap:10px}
.compteur{font:600 12px Arial;background:var(--orange-p);color:var(--orange-f);border-radius:50px;padding:3px 9px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:50px;padding:7px 15px;font:600 12.5px Arial;border:1px solid var(--noir);background:transparent;color:var(--noir);white-space:nowrap}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.noir{background:var(--noir);color:var(--beige)}
.btn.leger{border-color:var(--gris-c);background:var(--blanc);font-weight:500}
.btn.icone{padding:7px 9px}
.chiffres{font-variant-numeric:tabular-nums}
.recherche{display:flex;align-items:center;gap:8px;background:var(--blanc);border:1px solid var(--gris-c);border-radius:50px;padding:7px 14px;color:var(--gris);min-width:260px}
.recherche kbd{margin-left:auto;font:11px Arial;background:var(--beige);border-radius:5px;padding:1px 6px;color:var(--gris)}
table{width:100%;border-collapse:collapse}
th{font:600 11px Arial;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);text-align:left;padding:9px 12px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--ligne);vertical-align:middle;white-space:nowrap}
.case{width:15px;height:15px;border:1.5px solid #cfc8bb;border-radius:4px;display:inline-block;vertical-align:middle;background:#fff}
.case.coche{background:var(--orange);border-color:var(--orange);position:relative}
.case.coche:after{content:"✓";color:#fff;font-size:10px;position:absolute;left:2px;top:-1px}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font:700 10.5px Arial;flex:0 0 auto}
.a1{background:#fde4d6;color:#b5521f}.a2{background:#e3eefc;color:#1d4f91}.a3{background:#e2f3ea;color:#1f7a4d}.a4{background:#efe6fb;color:#5b3a99}.a5{background:#ece9e2;color:#555}
.identite{display:flex;align-items:center;gap:10px}
.nom{font-weight:600;color:var(--noir)}
.sous{color:var(--gris);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:50px;padding:2px 9px;font:600 11px Arial}
.p-ok{background:#e2f3ea;color:var(--succes)}.p-al{background:#fdecea;color:var(--erreur)}.p-ne{background:#efebe3;color:#6b655b}.p-or{background:var(--orange-p);color:var(--orange-f)}
.point{width:7px;height:7px;border-radius:50%;display:inline-block}
.sel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gris-c);background:var(--blanc);border-radius:50px;padding:6px 13px;font-size:12.5px}
.sel i.bi-chevron-down{font-size:10px;color:var(--gris)}
.muted{color:var(--gris)}
.pagination{display:flex;gap:4px;align-items:center}
.pg{min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--noir)}
.pg.on{background:var(--noir);color:var(--beige)}
.kebab{color:var(--gris);font-size:15px}
.annee{font:600 10.5px Arial;background:var(--beige);border-radius:50px;padding:1px 7px;margin-left:6px;color:var(--gris)}
</style>
</head>
